<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kyros Focus</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <div class="brand"><img class="brand-logo" src="icons/icon128.png" alt="Kyros logo"><div><strong>Kyros Focus</strong><small>Browser connection</small></div></div>
      <p id="status" class="status" role="status">Checking the current tab…</p>
      <p id="detail" class="detail">Open your Kyros Focus page, then connect this tab.</p>
      <button id="connect" type="button" disabled>Connect this tab</button>
      <p class="footnote">Kyros access is used only to connect this app tab. Your selected sites are blocked only while the focus timer runs.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
